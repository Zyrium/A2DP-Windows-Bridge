[package]
name = "bluecaster-core"
description = "BlueCaster's core: the streaming state machine, Bluetooth stack lifecycle, profiles, settings, devices"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "bluecaster_core"

[dependencies]
bt-host.workspace = true
# LE Audio (experimental): plans, SDU sets, --le-sim-volume, the MCP backend
le-audio.workspace = true
hci-transport.workspace = true
codec = { workspace = true, features = ["default"] }
pipeline.workspace = true
# media_eq.rs: the playback EQ's points as profiles.json keeps them
dsp.workspace = true
audio-capture.workspace = true
# stream.rs, voice.rs: the render devices, through the session host
session-host.workspace = true
# voice.rs: headset mode's voice link (codecs, microphone render, uplink)
voice-link.workspace = true
win-sys.workspace = true
input-helper.workspace = true
hid-input.workspace = true
# compat.rs: the 2.0.x pipe and mutex names (defined next to the new ones)
ipc.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
# update.rs (and firmware.rs): GitHub Releases API (rustls, the system proxy as v1's WinHTTP),
# version precedence, and the local date of the daily check
ureq = { version = "3.3", default-features = false, features = ["rustls", "win-system-proxy"] }
semver = "1"
time = { version = "0.3", features = ["local-offset"] }
# receiver.rs: the broadcast address of every IPv4 network (discovery)
if-addrs = "0.15"
# firmware.rs: checks the Realtek files fetched from linux-firmware
sha2 = "0.10"

[dev-dependencies]
# le_stream.rs tests: a microphone ring without a stack
rtrb.workspace = true
# receiver.rs tests: a port that refuses, held for the whole test
socket2.workspace = true

[lints]
workspace = true
