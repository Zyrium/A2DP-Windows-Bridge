# The hci_usb sample's settings, with BlueCaster's USB HCI class
# (src/bt_hci_iso.c) instead of CONFIG_USBD_BT_HCI
CONFIG_BT=y
CONFIG_BT_HCI_RAW=y
# Console on the J-Link VCOM, for the trace (BLUECASTER_TRACE)
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_BLUECASTER_TRACE=y

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
# 2FE3:000B, known to BlueCaster
CONFIG_SAMPLE_USBD_PID=0x000B
CONFIG_SAMPLE_USBD_PRODUCT="Zephyr USBD BT HCI"
CONFIG_USBD_BT_HCI=n

# ISO over the HCI (BlueCaster sends the BIS SDUs as HCI ISO data)
CONFIG_BT_ISO_BROADCASTER=y
CONFIG_BT_ISO_MAX_CHAN=4
CONFIG_BT_ISO_TX_BUF_COUNT=12
CONFIG_BT_ISO_TX_MTU=251
CONFIG_BT_BUF_EVT_RX_COUNT=16
CONFIG_BT_BUF_CMD_TX_SIZE=255
CONFIG_BT_BUF_EVT_RX_SIZE=255
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=255
